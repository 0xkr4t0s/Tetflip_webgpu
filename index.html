<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Real-time TETFLIP liquid simulation on tetrahedral meshes, running entirely on the GPU with WebGPU." />
    <title>TETFLIP · WebGPU liquid</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 L28 26 H4 Z' fill='%234aa3ff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="view" aria-label="Liquid simulation view"></canvas>

    <header class="hud hud-title">
      <h1>TETFLIP</h1>
      <p>Adaptive-ready liquid on tetrahedral meshes · <a href="https://doi.org/10.1145/2461912.2461982" target="_blank" rel="noopener">Ando, Thuerey &amp; Wojtan 2013</a></p>
    </header>

    <section class="hud hud-stats" aria-live="polite">
      <dl id="stats"></dl>
    </section>

    <footer class="hud hud-help">
      <span><kbd>drag</kbd> orbit</span>
      <span><kbd>right-drag</kbd> pan</span>
      <span><kbd>wheel</kbd> zoom</span>
      <span><kbd>shift</kbd>+<kbd>drag</kbd> push liquid</span>
      <span><kbd>space</kbd> pause</span>
      <span><kbd>R</kbd> reset</span>
      <span><kbd>V</kbd> view</span>
      <span><kbd>M</kbd> mesh</span>
    </footer>

    <div id="overlay" class="overlay" hidden>
      <div class="overlay-card">
        <div class="spinner" aria-hidden="true"></div>
        <p id="overlay-text">Building mesh…</p>
      </div>
    </div>

    <div id="error" class="overlay" hidden>
      <div class="overlay-card error-card">
        <h2>WebGPU unavailable</h2>
        <p id="error-text"></p>
        <p class="muted">Try a recent Chrome, Edge or Safari, or Firefox with WebGPU enabled.</p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
